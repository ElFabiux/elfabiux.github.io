<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Personal portfolio focused on software development, technology, and continuous learning."
    />
    <title>Portfolio | Home</title>
    <script src="./assets/js/theme-init.js?v=4"></script>
    <link rel="stylesheet" href="./assets/css/styles.css?v=13" />
  </head>
  <body data-page="home" data-root-prefix="." data-site-config-state="pending">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header" data-site-header></header>

    <main class="page-shell home-page" id="main-content">
      <section class="whoami" aria-labelledby="whoami-title">
        <p class="command-line" aria-hidden="true">
          <span class="command-prompt">$</span> whoami
        </p>
        <h1 id="whoami-title" data-profile-name data-site-config-content>Portfolio Owner</h1>
        <div
          class="whoami__description"
          data-profile-description
          data-site-config-content
        >
          <p>Software developer focused on building useful, maintainable digital products.</p>
        </div>
        <div class="command-actions" data-home-links data-site-config-content></div>
        <div
          class="home-terminal"
          role="img"
          aria-label="Animated terminal showing current interests, work principles, and continuous learning."
        >
          <div class="home-terminal__bar">
            <span>guest@portfolio:~</span>
            <span>session active</span>
          </div>
          <div class="home-terminal__body" aria-hidden="true">
            <div class="home-terminal__command">
              <span class="home-terminal__prompt">$</span>
              <span data-terminal-command></span>
              <span class="home-terminal__cursor"></span>
            </div>
            <div class="home-terminal__output" data-terminal-output></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer" data-site-footer></footer>

    <script src="./assets/js/config.js?v=6"></script>
    <script src="./assets/js/data.js?v=6"></script>
    <script src="./assets/js/components.js?v=10"></script>
    <script src="./assets/js/app.js?v=15"></script>
  </body>
</html>
